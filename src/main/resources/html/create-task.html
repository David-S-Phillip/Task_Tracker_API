<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Task</title>
</head>
<body>

    <h1>Create a New Task</h1>
    <div>
    <label for="task-title">Title:</label><br>
        <input type="text" id = "task-title" placeholder="e.g Buy food instead of beer we are adults with allowance money"><br><br>

        <label for="task-desc">Description</label><br>
        <textarea id = "task-desc" placeholder="e.g Get milk and bread"></textarea>
        <br>
        <br>

        <button id="submit-btn">Submit Task</button>
        <a href = "index.html" target="_blank"><button type="button">Back to Tasks</button></a>
    </div>

<p id = "status-message"></p>

<script src="js/create-task.js"></script>
</body>


</html>
